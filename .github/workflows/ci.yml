name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-key
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Web, mobile and package builds
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start isolated database
        run: supabase start
      - name: Lint database
        run: supabase db lint --local --fail-on error
      - name: Run database tests
        run: supabase test db
