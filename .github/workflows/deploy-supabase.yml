name: Deploy Supabase

on:
  push:
    branches: [master, main]
    paths:
      - "project/supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  pull_request:
    paths:
      - "project/supabase/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas mostrar o plano das migrations (não aplica)"
        type: boolean
        required: false
        default: true
      include_all:
        description: "Aplicar também migrations locais que ainda não estão no histórico remoto"
        type: boolean
        required: false
        default: false
      deploy_functions:
        description: "Fazer deploy das Edge Functions (se a pasta existir)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: project/supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Validate required secrets
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::Falta o secret SUPABASE_PROJECT_REF (ex.: bznafaklqxtmwhpnrumd)"
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ] && [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Defina SUPABASE_DB_PASSWORD (recomendado) ou SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "Project ref: ${SUPABASE_PROJECT_REF}"

      - name: Link to the remote project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN}" ]; then
            supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD:-}"
          else
            supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"
          fi

      - name: Show pending migrations
        id: pending
        continue-on-error: true
        run: supabase migration list

      - name: Apply migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_ALL: ${{ inputs.include_all }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run: a listar o plano sem aplicar alterações."
            supabase db push --dry-run
            exit 0
          fi
          if [ "${INCLUDE_ALL:-false}" = "true" ]; then
            supabase db push --include-all --password "${SUPABASE_DB_PASSWORD}"
          else
            supabase db push --password "${SUPABASE_DB_PASSWORD}"
          fi

      - name: Deploy Edge Functions
        if: ${{ inputs.deploy_functions != false && hashFiles('supabase/functions/**') != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -d functions ]; then
            supabase functions deploy --project-ref "${SUPABASE_PROJECT_REF}"
          else
            echo "Sem pasta functions/ neste commit; nada a fazer."
          fi

      - name: Verify remote schema is reachable
        if: ${{ inputs.dry_run != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Secrets SUPABASE_URL/SUPABASE_ANON_KEY não definidos; verificação ignorada."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/rpc/search_products?search=verificacao&limit=1")
          echo "search_products -> HTTP ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::A RPC search_products não respondeu 200 depois do deploy."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy Supabase"
            echo ""
            echo "- Project ref: \`${{ secrets.SUPABASE_PROJECT_REF }}\`"
            echo "- Modo: ${{ inputs.dry_run == true && 'dry-run' || 'aplicado' }}"
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
